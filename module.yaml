authors:
  - name: kreza6173-pixel
    url: https://github.com/kreza6173-pixel

compatibility:
  androidMinApi: 28
  architectures: [arm64-v8a, armeabi-v7a, x86_64, x86]

release:
  assetPattern: "orbit_store-*.zip"
