# yaml-language-server: $schema=https://raw.githubusercontent.com/KernelSU-Modules/tools/main/schemas/module.schema.json
schemaVersion: 1
id: orbit_store
name: ORBIT // STORE
summary: A module store inside your root manager. KernelSU Modules, KernelSU Next and Magisk Alt Repo catalogs in one place, plus curated root app and module lists by category. sha256 verification, update badges and metamodule conflict warnings.
description: README.md
license: MIT
homepage: https://github.com/kreza6173-pixel/orbit-store
support: https://github.com/kreza6173-pixel/orbit-store/issues
